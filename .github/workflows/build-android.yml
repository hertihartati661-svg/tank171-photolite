name: Build PhotoLite 171 Compression APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Give APK a distinct compression-only filename
        run: cp app/build/outputs/apk/debug/app-debug.apk PhotoLite-171-Kompresi-Saja.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoLite-171-Compression-APK
          path: PhotoLite-171-Kompresi-Saja.apk
          # Artifact name uses the new app brand.
          if-no-files-found: error
          retention-days: 14
