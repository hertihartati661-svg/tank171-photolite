name: Build PicLite171 APK # Validate flexible min-max size controls

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Name APK PicLite171.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk PicLite171.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PicLite171-APK
          path: PicLite171.apk
          if-no-files-found: error
          retention-days: 14
